services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nba']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  api:
    build: ./backend
    environment:
      NBA_DATABASE_URL: postgresql+psycopg://nba:nba@db:5432/nba
      NBA_REDIS_URL: redis://redis:6379/0
      NBA_MODEL_DIR: /srv/models
      NBA_CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
    volumes:
      - ./backend/models:/srv/models
    ports: ['8000:8000']
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  # Offline batch worker: ingest + nightly retrain. Never serves traffic, so it
  # can take its time with the rate-limited scrapers.
  worker:
    build: ./backend
    command: ['sleep', 'infinity']
    environment:
      NBA_DATABASE_URL: postgresql+psycopg://nba:nba@db:5432/nba
      NBA_REDIS_URL: redis://redis:6379/0
      NBA_MODEL_DIR: /srv/models
    volumes:
      - ./backend/models:/srv/models
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
